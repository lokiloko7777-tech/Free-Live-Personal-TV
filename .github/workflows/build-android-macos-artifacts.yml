name: Build Android + macOS Artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - web/**
      - server/**
      - scripts/**
      - ios/**
      - android/**
      - package.json
      - package-lock.json
      - capacitor.config.json
      - .github/workflows/build-android-macos-artifacts.yml

permissions:
  contents: write

jobs:
  android-apk:
    name: Android APK (Redmi Pro compatible)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build debug APK
        run: npm run android:apk:debug

      - name: Prepare Android artifacts
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/free-live-personal-tv-redmi-pro-debug.apk
          sha256sum artifacts/free-live-personal-tv-redmi-pro-debug.apk > artifacts/free-live-personal-tv-redmi-pro-debug.apk.sha256

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-redmi-pro-apk
          path: |
            artifacts/free-live-personal-tv-redmi-pro-debug.apk
            artifacts/free-live-personal-tv-redmi-pro-debug.apk.sha256
          if-no-files-found: error

  macos-app:
    name: macOS .app + .dmg
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS project
        run: npm run mac:sync

      - name: Build Mac Catalyst app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'platform=macOS,name=My Mac' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create macOS DMG
        run: |
          mkdir -p artifacts
          APP_PATH="ios/build/Build/Products/Release-maccatalyst/App.app"
          cp -R "$APP_PATH" artifacts/Free-Live-Personal-TV.app
          ditto -c -k --sequesterRsrc --keepParent artifacts/Free-Live-Personal-TV.app artifacts/free-live-personal-tv-macos.app.zip
          hdiutil create \
            -volname "Free-Live-Personal-TV" \
            -srcfolder artifacts/Free-Live-Personal-TV.app \
            -ov \
            -format UDZO \
            artifacts/free-live-personal-tv-macos.dmg
          shasum -a 256 artifacts/free-live-personal-tv-macos.app.zip > artifacts/free-live-personal-tv-macos.app.zip.sha256
          shasum -a 256 artifacts/free-live-personal-tv-macos.dmg > artifacts/free-live-personal-tv-macos.dmg.sha256

      - name: Upload macOS app and DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-dmg
          path: |
            artifacts/free-live-personal-tv-macos.app.zip
            artifacts/free-live-personal-tv-macos.app.zip.sha256
            artifacts/free-live-personal-tv-macos.dmg
            artifacts/free-live-personal-tv-macos.dmg.sha256
          if-no-files-found: error

  windows11-portable:
    name: Windows 11 portable package
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable Windows package
        shell: pwsh
        run: |
          $outRoot = "artifacts/windows11/Free-Live-Personal-TV-Windows11"
          New-Item -ItemType Directory -Force -Path $outRoot | Out-Null

          Copy-Item -Recurse -Force server $outRoot
          Copy-Item -Recurse -Force web $outRoot
          Copy-Item -Recurse -Force scripts $outRoot
          if (Test-Path data) {
            Copy-Item -Recurse -Force data $outRoot
          }
          Copy-Item -Recurse -Force node_modules $outRoot
          Copy-Item -Force package.json $outRoot
          Copy-Item -Force package-lock.json $outRoot

          New-Item -ItemType Directory -Force -Path "$outRoot/runtime" | Out-Null
          $nodePath = (Get-Command node).Source
          Copy-Item -Force $nodePath "$outRoot/runtime/node.exe"

          @(
            '@echo off',
            'setlocal',
            'cd /d %~dp0',
            'if not exist uploads mkdir uploads',
            'if not exist data mkdir data',
            'runtime\\node.exe server\\index.js'
          ) | Set-Content -Encoding ASCII "$outRoot/start-flpt-windows11.bat"

          @(
            'Free Live Personal TV - Windows 11 portable',
            '',
            '1) Double click start-flpt-windows11.bat',
            '2) Open http://localhost:8080',
            '3) For LAN testing use http://<your-local-ip>:8080'
          ) | Set-Content -Encoding UTF8 "$outRoot/README-WINDOWS11.txt"

          Compress-Archive -Path "$outRoot/*" -DestinationPath "artifacts/free-live-personal-tv-windows11-portable.zip" -Force
          (Get-FileHash "artifacts/free-live-personal-tv-windows11-portable.zip" -Algorithm SHA256).Hash.ToLower() + "  free-live-personal-tv-windows11-portable.zip" | Set-Content -Encoding ASCII "artifacts/free-live-personal-tv-windows11-portable.zip.sha256"

      - name: Upload Windows 11 package
        uses: actions/upload-artifact@v4
        with:
          name: windows11-portable
          path: |
            artifacts/free-live-personal-tv-windows11-portable.zip
            artifacts/free-live-personal-tv-windows11-portable.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release Assets
    if: startsWith(github.ref, 'refs/tags/v') && always()
    needs: [android-apk, macos-app, windows11-portable]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-redmi-pro-apk
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-app-dmg
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows11-portable
          path: release-assets

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**
