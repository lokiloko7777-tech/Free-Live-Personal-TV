name: Diagrams Export Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - docs/github/**
      - scripts/export-diagrams.mjs
      - package.json
      - package-lock.json
      - .github/workflows/diagrams-export-check.yml
  push:
    branches: [main]
    paths:
      - docs/github/**
      - scripts/export-diagrams.mjs
      - package.json
      - package-lock.json
      - .github/workflows/diagrams-export-check.yml

permissions:
  contents: read

jobs:
  export-diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export diagrams (SVG/PNG)
        run: npm run export:diagrams

      - name: Upload diagram artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diagrams-export
          path: docs/github/diagrams/export
          if-no-files-found: error
