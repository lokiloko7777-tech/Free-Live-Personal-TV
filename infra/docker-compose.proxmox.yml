services:
  app:
    image: node:20-bookworm-slim
    working_dir: /app
    command: sh -c "apt-get update && apt-get install -y ffmpeg && npm ci && NODE_ENV=production node server/index.js"
    volumes:
      - ../:/app
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NODE_ENV=production
      - FFMPEG_ENABLED=1
      - FFMPEG_PRESET=veryfast
      - FFMPEG_CRF=29
      - RATE_LIMIT_ENABLED=1
      - REQUIRE_HTTPS=0
      - AUTH_SESSION_TTL_MS=604800000
      - ADMIN_USER_IDS=u-admin123
    restart: unless-stopped
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=flpt
      - POSTGRES_USER=flpt
      - POSTGRES_PASSWORD=flpt_change_me
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin_change_me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  minio_data:
  pg_data:
